<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鱼小铺 - 自动发货与运营工作台</title>
    <meta name="description" content="闲鱼自动回复、自动发货、订单管理、AI智能议价一体化解决方案" />
    <script>
      (() => {
        const applyAppearance = () => {
          try {
            const stored = localStorage.getItem('xianyu-theme-preference');
            const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system';
            const resolved = preference === 'system'
              ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : preference;
            document.documentElement.dataset.theme = resolved;
            document.documentElement.dataset.themePreference = preference;
            document.documentElement.classList.toggle('dark', resolved === 'dark');
            document.documentElement.style.colorScheme = resolved;

            const brand = localStorage.getItem('xianyu-brand');
            if (['sky', 'jade', 'royal', 'coral', 'violet', 'rose'].includes(brand)) {
              document.documentElement.dataset.brand = brand;
            } else {
              delete document.documentElement.dataset.brand;
            }
          } catch {
            document.documentElement.dataset.theme = 'light';
            document.documentElement.style.colorScheme = 'light';
          }
        };
        applyAppearance();
      })();
    </script>
    <script type="module" crossorigin src="/static/assets/index-YyTQ1iYV.js"></script>
    <link rel="stylesheet" crossorigin href="/static/assets/index-G7hEYCz2.css">
  </head>

    <div id="root"></div>
  </body>
</html>
