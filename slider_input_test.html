<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>滑块注入测试</title>
<style>
body { font-family: sans-serif; margin: 40px; }
#track { width: 400px; height: 60px; background: #eee; border-radius: 8px; position: relative; }
#btn { width: 60px; height: 60px; background: #4a90d9; border-radius: 8px; position: absolute; left: 0; top: 0; cursor: grab; }
#result { margin-top: 20px; white-space: pre; font-family: monospace; font-size: 12px; }
</style></head>
<body>
<div id="track"><div id="btn"></div></div>
<div id="result">等待拖动…</div>
<script>
window.dragStats = [];
let cur = null;
const btn = document.getElementById('btn');
btn.addEventListener('pointerdown', e => {
  cur = { moves: 0, coalescedTotal: 0, coalescedMax: 0, coalescedSamples: [],
          downTrusted: e.isTrusted, startX: e.clientX, startY: e.clientY,
          maxDX: 0, upTrusted: null, endDX: 0 };
  window.dragStats.push(cur);
});
window.addEventListener('pointermove', e => {
  if (!cur) return;
  cur.moves++;
  let co = -1;
  try { co = e.getCoalescedEvents().length; } catch (err) { co = -1; }
  cur.coalescedTotal += co;
  if (cur.coalescedSamples.length < 24) cur.coalescedSamples.push(co);
  if (co > cur.coalescedMax) cur.coalescedMax = co;
  cur.maxDX = Math.max(cur.maxDX, e.clientX - cur.startX);
});
window.addEventListener('pointerup', e => {
  if (!cur) return;
  cur.upTrusted = e.isTrusted;
  cur.endDX = e.clientX - cur.startX;
  document.getElementById('result').textContent = JSON.stringify(window.dragStats, null, 2);
  cur = null;
});
</script>
</body>
</html>
